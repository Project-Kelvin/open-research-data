[tool.poetry]
name = "genesis_experiments"
version = "0.1.0"
description = ""
authors = ["Theviyanthan Krishnamohan"]
package-mode = false
packages = [{include = "analysis"}]

[tool.poetry.dependencies]
python = ">=3.12"
polars = "^1.33.1"
numpy = "^2.3.3"
matplotlib = "^3.10.6"
scipy = "^1.17.1"
lifelines = "^0.30.3"
