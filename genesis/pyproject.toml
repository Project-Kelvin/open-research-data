[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
analyse = "analysis.analysis:run"
test = "analysis.statistical_test:run"
ablation = "analysis.ablation:run"
ablationTest = "analysis.ablation_test:main"
