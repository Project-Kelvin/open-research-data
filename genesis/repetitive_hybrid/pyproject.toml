[tool.poetry]
name = "hyperparameter-ga-v2-analysis"
version = "0.1.0"
description = "Summaries for hyperparameter GA v2 experiments"
authors = ["Theviyanthan Krishnamohan"]
package-mode = false
packages = [{ include = "analysis" }]

[tool.poetry.dependencies]
python = ">=3.14,<4"
scipy = "^1.18.0"
lifelines = "^0.30.3"
pandas = "2.3.3"
matplotlib = "^3.11.1"
pymoo = "^0.6.2"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
analyse = "analysis.analysis:main"
test = "analysis.test:main"
